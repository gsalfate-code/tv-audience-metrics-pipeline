[project]
name = "tv-audience-metrics-pipeline"
version = "0.1.0"
description = "POC: TV audience metrics pipeline (Rating% & Share%) - Medallion architecture, DuckDB, S3, GitHub Actions"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34",
    "duckdb>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: tests that hit a real S3 bucket; only run in GitHub Actions",
]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]
